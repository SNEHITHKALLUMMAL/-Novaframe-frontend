# Mirrors what vite.config.js's dev-server proxy does locally: the SPA,
# the REST API, and the Socket.IO upgrade all appear to the browser as one
# origin, so cookies (httpOnly, sameSite) work exactly the same way in
# Docker as they do in local dev — no separate CORS configuration needed
# for the common case of serving both from behind the same host/port.
# 'server' below is the docker-compose service name for the API container;
# change it if you rename that service.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routing (React Router) owns every path
    # that isn't a real static asset.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /storage/ {
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
    }

    # Static assets get a long cache lifetime — Vite fingerprints filenames
    # on every build, so a stale cached asset is never served under the
    # same URL as a changed one.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
